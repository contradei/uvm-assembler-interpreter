name: Validate all coursework stages
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development checks
        run: python -m pip install flake8 pep8-naming radon
      - name: Validate every stage independently
        run: python scripts/check_history.py
